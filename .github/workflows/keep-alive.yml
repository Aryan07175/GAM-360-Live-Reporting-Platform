name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent the Render free tier from sleeping (sleeps after 15 mins of inactivity)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: curl -s https://gam-360-live-reporting-platform.onrender.com/health | grep '"status":"ok"' || echo "Ping failed or returned unexpected response"
