# render.yaml — Render Blueprint for GAM 360 Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gam360-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server/render_start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GAM_NETWORK_CODE
        sync: false
      - key: GAM_APPLICATION_NAME
        value: GAM360-Revenue-Pipeline
      - key: GAM_API_VERSION
        value: v202602
      - key: GAM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GAM_REQUEST_TIMEOUT
        value: "120"
      - key: GAM_MAX_PARALLEL_REQUESTS
        value: "5"
      - key: REVENUE_IN_MICROS
        value: "false"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      # Cross-region inference profile ID — must match bedrock_service.py default.
      # Use the us.* prefix for cross-region routing (required for Haiku 4.5 in us-east-1).
      - key: BEDROCK_MODEL_ID
        value: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      # Optional: Bearer token for IAM Identity Center / SSO auth (alternative to Access Key)
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      # HMAC secret used to sign and verify human-in-the-loop write-action tokens.
      # MUST be set to a strong random secret in production — the insecure default
      # in server.py ("gam360-write-secret-change-me") is only a development fallback.
      - key: WRITE_ACTION_SECRET
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
